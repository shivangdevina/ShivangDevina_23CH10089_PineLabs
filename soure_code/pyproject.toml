[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-business-analyst"
version = "0.3.0"
description = "Evidence-backed payment analysis; Supabase-only data foundation."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "numpy>=2,<3", "pglast>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
payment-data = "payments_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
payments_analyst = ["migrations/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
